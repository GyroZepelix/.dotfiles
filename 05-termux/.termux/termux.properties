# Termux-specific configuration managed by the 05-termux dotfiles module.
# Apply changes with: termux-reload-settings

# Keep the toolbar compact while retaining comfortable touch targets.
terminal-toolbar-height = 1.0
extra-keys-style = arrows-all
extra-keys-text-all-caps = false

# Tap actions:
#   ESC, CTRL, ALT, tmux prefix (Ctrl+S), /, -, and arrow keys.
# Swipe-up actions:
#   TAB, Neovim window prefix (Ctrl+W), keyboard toggle, tmux copy mode,
#   :, |, HOME, PGDN, PGUP, and END.
extra-keys = [[ \
  {key: ESC, popup: TAB}, \
  {key: CTRL, popup: {macro: "CTRL w", display: "nvim"}}, \
  {key: ALT, popup: KEYBOARD}, \
  {macro: "CTRL s", display: "tmux", popup: {macro: "CTRL s [", display: "copy"}}, \
  {key: '/', popup: ':'}, \
  {key: '-', popup: '|'}, \
  {key: LEFT, popup: HOME}, \
  {key: DOWN, popup: PGDN}, \
  {key: UP, popup: PGUP}, \
  {key: RIGHT, popup: END} \
]]
